services:
  postgres:
    image: postgres:16-alpine
    container_name: telangana-realty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: telangana_realty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telangana-realty-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/telangana_realty
      DB_SSL: "false"
      JWT_SECRET: super-secret-telangana-realty-jwt-key-2026
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
      NOTIFICATION_PROVIDER: mock
      ADMIN_ALERT_PHONE: "+919876543210"
      ADMIN_ALERT_WHATSAPP: "+919876543210"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
